.bg::after{content:"";position:absolute;inset:0;background:rgba(30,8,20,var(--dim))}
main{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,.price,.bar button,.go{font-family:Fredoka,system-ui,sans-serif}
.hero{text-align:center;padding:64px 0 4px}
.logo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 4px 0 rgba(58,29,20,.25)}
h1{font-size:38px;line-height:1.05;margin:12px 0 4px;color:#fff;font-weight:600;text-shadow:0 2px 0 #7A2A3E}
.tag{margin:0;font-size:18px;color:#fff;text-shadow:0 1px 0 #7A2A3E}
section{margin-top:30px;background:var(--veil);border-radius:24px;padding:14px}
h2{font-size:25px;margin:0 0 2px;font-weight:600}
.sub{margin:0 0 12px;color:var(--soft)}
section img{width:100%;height:160px;object-fit:cover;border-radius:16px;display:block;margin-bottom:10px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--row);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.item span{color:var(--soft);display:block;font-size:14px}
.r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.price{font-size:19px;color:var(--pink);white-space:nowrap;font-weight:600}
button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}
.add{border:0;border-radius:999px;padding:8px 16px;background:var(--pink);color:#fff;font-weight:700}
.step{display:flex;align-items:center;gap:8px}
.step button{width:34px;height:34px;border-radius:50%;border:2px solid var(--pink);background:none;color:var(--pink);font-size:20px;line-height:1;padding:0}
.step b{min-width:16px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--veil);border-top:2px solid var(--line)}
.bar button{border:0;border-radius:999px;padding:14px 20px;font-size:18px;font-weight:600}

.note{color:var(--soft);font-size:15px;margin:4px 0 12px}
label{display:block;font-weight:700;margin:8px 0}
input,select,textarea{display:block;width:100%;font:inherit;font-size:16px;padding:10px 12px;margin-top:4px;border-radius:12px;border:2px solid var(--line);background:var(--row);color:var(--ink)}
.pay{margin-top:14px;padding:16px;border-radius:20px;background:var(--teal);color:#fff}
.pay h2{color:#fff}.pay p{margin:6px 0}
.pay button,.go{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:999px;padding:12px;margin-top:8px;font-weight:700;font-size:17px}
.pay button{background:#fff;color:#0A6B63}.go{background:#25D366;color:#073B1B}.call{background:#fff;color:#0A6B63}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.logobtn{background:none;border:0;padding:0;border-radius:50%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}.logobtn:focus:not(:focus-visible){outline:none}.logobtn img{pointer-events:none;-webkit-user-drag:none}
.fl{position:fixed;bottom:-50px;pointer-events:none;z-index:50;animation:up 3.4s ease-in forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(50deg);opacity:.25}}
@media (prefers-reduced-motion:reduce){.fl{animation-duration:.01s}}
.badge{font-style:normal;background:var(--teal);color:#fff;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;margin-left:8px;vertical-align:middle}
.stars{display:flex;gap:4px;margin:6px 0}.stars button{font-size:34px;line-height:1;background:none;border:0;color:#C9A0AE;padding:0 2px}.stars button.on{color:#F5A200}
.rev{background:var(--row);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}.rev b{color:#C27C00}
.call{border:2px solid var(--teal)}.ig{background:var(--pink);color:#fff}
.steps{margin:0;padding-left:22px}.steps li{margin:6px 0}
.feat{background:#C2185B;color:#fff;text-align:center}.feat h2{color:#fff}.feat p{margin:6px 0 4px}.feat .go{background:#fff;color:#7A0F3A}
.big{font-size:40px;line-height:1}.fine{font-size:13px;margin:12px 0 0!important;opacity:.95}
.center{text-align:center}.center .sub{margin-bottom:10px}.center .rev{text-align:left}.wide{padding:12px 24px;font-size:17px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}.duo .go{margin-top:0;font-size:16px;padding:12px 8px}
.handle{margin:10px 0 0;color:var(--soft);font-size:14px}
.cp{display:block;width:100%;margin-top:8px;border:2px solid var(--teal);background:none;color:var(--ink);border-radius:999px;padding:10px;font-weight:700;font-size:16px}
